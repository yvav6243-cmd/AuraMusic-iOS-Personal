workflows:
  ios-windows-sideload-ipa:
    name: AuraMusic iOS IPA Builder (Windows Sideloading)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build Release iOS Application Bundle
        script: |
          xcodebuild clean build \
            -project AuraMusic.xcodeproj \
            -scheme AuraMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Create AuraMusic.ipa
        script: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AuraMusic.app build/Payload/
          cd build && zip -qry AuraMusic.ipa Payload
    artifacts:
      - build/AuraMusic.ipa
