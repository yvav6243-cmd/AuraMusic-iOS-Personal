name: AuraMusic
options:
  bundleIdPrefix: com.personal.auramusic
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: AuraMusic/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AuraMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuraMusic
        excludes:
          - "Info.plist"
    resources:
      - path: AuraMusic/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.auramusic.player
        PRODUCT_NAME: AuraMusic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    frameworks:
      - SwiftUI
      - SwiftData
      - AVFoundation
      - AVKit
      - MediaPlayer
      - MusicKit
      - WebKit
      - ActivityKit
      - NaturalLanguage
      - Speech

  AuraMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuraMusicTests
    dependencies:
      - target: AuraMusic
